# Shared infrastructure for consumer E2E workflows (ordpool + cat21).
#
# The SDK owns the *base layer* — bitcoind, electrs, mariadb, optional
# redis. Each consumer's CI workflow then composes their own backend
# services on top via an additional `-f docker-compose.<consumer>.yml`
# file. This split keeps the SDK from knowing anything about either
# consumer's backend Dockerfile, while still giving both a single
# reproducible Bitcoin/DB substrate they share.
#
# Profiles:
#   (default)  — bitcoind, electrs, mariadb. Required for any consumer mint flow.
#   redis      — opt-in redis cache. Pass `--profile redis` when bringing up
#                if the consumer's backend uses it.
#
# Usage:
#   # cat21-indexer (no redis, just mariadb is enough):
#   docker compose -f e2e/docker-compose.consumer-environment.yml \
#                  -f e2e/docker-compose.cat21-indexer.yml \
#                  up -d
#
#   # ordpool (wants redis too):
#   docker compose -f e2e/docker-compose.consumer-environment.yml \
#                  -f e2e/docker-compose.ordpool.yml \
#                  --profile redis \
#                  up -d
#
# The base bitcoind + electrs services here duplicate
# `docker-compose.regtest.yml` rather than `include:`-ing it; that
# file is the SDK's own E2E surface and we don't want a change there
# to silently alter consumer environments. Two files, two scopes.

services:

  bitcoind:
    image: ruimarinho/bitcoin-core:24-alpine
    container_name: ordpool-e2e-consumer-bitcoind
    command:
      - -regtest
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=ordpool
      - -rpcpassword=ordpool
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -listen=1
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - "18443:18443"
      - "18444:18444"
      - "28332:28332"
      - "28333:28333"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=ordpool", "-rpcpassword=ordpool", "getblockchaininfo"]
      interval: 2s
      timeout: 2s
      retries: 30
      # CI cold-start (image pull + container init) can eat the first
      # ~20 seconds before bitcoind's RPC accepts connections. Without
      # a start_period docker counts those as failures and burns through
      # the retry budget before the daemon's even up.
      start_period: 30s

  electrs:
    image: mempool/electrs:latest
    container_name: ordpool-e2e-consumer-electrs
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --cookie=ordpool:ordpool
      - --http-addr=0.0.0.0:3000
      - --electrum-rpc-addr=0.0.0.0:50001
      - --jsonrpc-import
      - -vvvv
    ports:
      - "3000:3000"
      - "50001:50001"
    healthcheck:
      # Bash /dev/tcp socket probe. The mempool/electrs:latest image is
      # debian-slim based — no wget, no curl, no netcat — so the
      # upstream-style wget healthcheck always fails even when the
      # REST server is up on :3000. Confirmed by container logs
      # showing "REST server running on 0.0.0.0:3000" right next to
      # docker marking the container unhealthy. bash IS in the image
      # and its /dev/tcp magic file checks the port for free.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 2s
      timeout: 2s
      retries: 30
      # electrs needs to open RocksDB + run the initial 0-block index
      # before the REST server binds. Observed at ~150s on cold
      # ubuntu-latest runs (image pull + cold init). 90s of
      # start_period absorbs init while the socket-listening retries
      # cover any remaining slack.
      start_period: 90s

  mariadb:
    image: mariadb:11
    container_name: ordpool-e2e-consumer-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ordpool
    volumes:
      # init.d scripts run on first start. Creates both databases +
      # both per-consumer users so each backend can connect without
      # the CI workflow having to script DDL.
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
      # mariadb 11's first-boot bootstrap (running mariadb-init/*.sql)
      # adds noticeable startup time on cold runners; same start_period
      # treatment as the other infra services.
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ordpool-e2e-consumer-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
