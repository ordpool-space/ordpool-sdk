name: E2E (regtest)

# Real chain end-to-end: bitcoind + electrs in Docker, our
# createTransaction / signIdx / postTx round-trip against the actual
# Esplora API a user would hit.
#
# Without this we have no way of knowing that our signed bytes mine,
# that electrs accepts them, or that an scure version bump silently
# broke the wire format. Mock-based specs cover the call shape; this
# covers the call landing.

on:
  push:
    branches: [main]
  pull_request:

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:
  regtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ordpool-sdk

      # The electrs and cat21-ord revisions this SDK commit builds, one
      # KEY=sha per line (e2e/build-pins.env).
      - name: Read the build pins
        run: grep -E '^[A-Z0-9_]+=' ordpool-sdk/e2e/build-pins.env >> "$GITHUB_ENV"

      # cat21-mint-roundtrip + cat21-flow-roundtrip specs need the cat21-ord
      # service in the regtest stack (it's the reference PSBT producer and
      # the authoritative view of cat ownership). docker-compose.regtest.yml
      # builds it from ../../cat21-ord/; we co-locate the two repos here to
      # match the workspace convention.
      - name: Checkout cat21-ord (sibling)
        uses: actions/checkout@v5
        with:
          repository: ordpool-space/cat21-ord
          ref: ${{ env.CAT21_ORD_SHA }}
          path: cat21-ord

      # OUR electrs. docker-compose.regtest.yml builds the electrs service
      # from ../../ordpool-electrs/ (the ordpool-electrs fork), not the
      # upstream mempool/electrs image — the E2E stack must run our code.
      # Co-located as a sibling to match the compose's build context.
      - name: Checkout ordpool-electrs (sibling)
        uses: actions/checkout@v5
        with:
          repository: ordpool-space/ordpool-electrs
          ref: ${{ env.ORDPOOL_ELECTRS_SHA }}
          path: ordpool-electrs

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        working-directory: ordpool-sdk
        run: npm ci

      - name: Build SDK (so the helpers compile cleanly before the test imports them)
        working-directory: ordpool-sdk
        run: npm run build

      # The stack's slot (e2e/stack-slots.ts): its host ports, E2E_PREFIX and
      # container names, exported to every later step. A runner holds one
      # stack, so this is slot 0, the ports and names below. Held by the
      # runner's worker process ($PPID of a step), which lives for the job.
      - name: Acquire the regtest stack slot
        working-directory: ordpool-sdk
        run: node scripts/e2e-slots.mjs acquire --owner-pid "$PPID" --label "e2e-regtest" --format github | tee -a "$GITHUB_ENV"

      # A docker-container builder is what makes `type=gha` cache export
      # possible — the default `docker` driver can't export a cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exports ACTIONS_RUNTIME_TOKEN + the cache-service URLs into the
      # job env so buildx's `type=gha` backend can authenticate. Without
      # this, cache_to/from type=gha fails outside docker/build-push-action.
      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      # Without this the buildx cache never helps: the Dockerfiles do
      # `COPY . .`, so the copied context includes each fresh checkout's
      # `.git/` (fetch metadata, reflog, pack names) whose bytes differ
      # every run. That churns the COPY layer digest, which busts the
      # cargo-build layer beneath it — the multi-minute Rust compile
      # recompiles every time despite a warm cache. Excluding `.git`
      # (and any stray `target/`) makes the context content-identical
      # across checkouts of the same commit, so COPY and the compile
      # both cache-hit. Injected here so the electrs / cat21-ord forks
      # stay untouched.
      - name: Stabilise the build contexts for layer caching
        run: |
          printf '.git\ntarget\n' > ordpool-electrs/.dockerignore
          printf '.git\ntarget\n' > cat21-ord/.dockerignore

      # Compile the electrs + cat21-ord images through buildx bake so the
      # gha overlay's cache_from/to take effect. On an unchanged source
      # tree (electrs + cat21-ord are pinned by sha in build-pins.env) this is a
      # full cache hit and skips the multi-minute Rust compile. COMPOSE_BAKE
      # routes `compose build` through bake; bake loads each image (they all
      # have an `image:` name) into the local store for the up step.
      - name: Build electrs + cat21-ord images (buildx, gha-cached)
        working-directory: ordpool-sdk
        env:
          COMPOSE_BAKE: "true"
        run: >
          docker compose
          -f e2e/docker-compose.regtest.yml
          -f e2e/docker-compose.gha-cache.yml
          --profile cat21-ord --profile ord-stock
          build

      - name: Start bitcoind + electrs + cat21-ord + ord-stock (regtest)
        # regtest-bootstrap.sh polls readiness itself, so no --wait.
        # Images are pre-built by the buildx step above (--no-build), so
        # the base compose is enough here (no gha overlay at up time).
        #
        # Two ord variants:
        #   cat21-ord (E2E_ORD_HOST_PORT): with --index-cat21, used by
        #     cat21-mint + cat21-flow specs as the authoritative cat view.
        #   ord-stock (E2E_ORD_STOCK_HOST_PORT): without --index-cat21 (= stock ord),
        #     used by inscribe-ord-indexing-roundtrip to prove the SDK's
        #     inscriptions are recognised by an upstream-style ord.
        # Both run from the same cat21-ord image — one build, two
        # containers.
        working-directory: ordpool-sdk
        run: docker compose -f e2e/docker-compose.regtest.yml --profile cat21-ord --profile ord-stock up -d --no-build

      - name: Bootstrap regtest funds (101 blocks, emit funder keypair)
        id: bootstrap
        working-directory: ordpool-sdk
        run: |
          chmod +x e2e/regtest-bootstrap.sh
          BOOT=$(./e2e/regtest-bootstrap.sh)
          echo "$BOOT"
          echo "REGTEST_FUNDED_ADDR=$(echo "$BOOT" | jq -r .address)" >> "$GITHUB_ENV"
          echo "REGTEST_FUNDED_WIF=$(echo "$BOOT" | jq -r .wif)"     >> "$GITHUB_ENV"

      - name: Run E2E specs
        working-directory: ordpool-sdk
        run: npm run test:e2e:regtest

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== bitcoind ==="
          docker logs "$E2E_PREFIX-bitcoind" || true
          echo "=== electrs ==="
          docker logs "$E2E_PREFIX-electrs" || true
          echo "=== cat21-ord ==="
          docker logs "$E2E_PREFIX-cat21-ord" || true
          echo "=== ord-stock ==="
          docker logs "$E2E_PREFIX-ord-stock" || true

      # Tears the slot's compose projects down by name and releases the slot.
      - name: Tear down
        if: always() && env.E2E_SLOT != ''
        working-directory: ordpool-sdk
        run: node scripts/e2e-slots.mjs down "$E2E_SLOT" --force
