name: E2E (wallet matrix)

# Loads each wallet's published extension in headed Chromium under xvfb
# and runs that wallet's Playwright specs (loads / onboard / sdk-handshake
# / mint / inscribe / cat21 flows) against a fresh regtest stack.
#
# One matrix shard per wallet: the specs are wallet-isolated (each spec
# launches its own persistent context with `--load-extension` scoped to a
# single wallet), so a shard bootstraps only its own extension and runs
# only `playwright test <wallet>`. Sharding keeps every shard well under
# the per-job cap as the spec roster grows, and a slow or hanging wallet
# no longer starves the others (fail-fast is off, so one red wallet does
# not cancel the rest).
#
# This workflow does NOT run on dev machines. The wallet .crx files are
# unverified-binary code; we keep them off contributor laptops. CI gets a
# fresh container per run.

on:
  # Manual trigger: validate wallet-shard stability (e.g. re-sample a
  # previously flaky wallet) without pushing a commit.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'e2e/playwright/**'
      - '.github/workflows/e2e-playwright.yml'
      - 'src/**'
      - 'package*.json'
  pull_request:
    paths:
      - 'e2e/playwright/**'
      - '.github/workflows/e2e-playwright.yml'
      - 'src/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read    # gh release download needs read access to the same repo's releases

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Per-shard cap. On a WARM cache the electrs/cat21-ord image build is an
    # ~8s import, so a shard is npm ci + stack + one wallet's specs. The
    # heaviest shard is xverse (its specs run ~17 min: it seeds the shared
    # vault and carries the widest matrix). On a COLD cache the shard also
    # recompiles electrs (~10 min), so cold xverse ≈ 29 min — which the old
    # 30-min cap could not absorb. 40 covers the cold case with margin for
    # runner variance; warm shards finish in ~13-21 min well under it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ext` is the actions/cache key that pins the published .crx
          # version (see playwright-bootstrap.sh). Only the cat21wallet
          # shard also brings up cat21-ord — its transfer/offer/accept
          # specs poll `/status` on it; every other wallet needs only
          # bitcoind + electrs. Gated by wallet name below (a boolean
          # matrix flag can coerce to the string "false", which is
          # truthy — the name comparison is unambiguous).
          - { wallet: xverse,      ext: "xverse-extension-v2.3.2" }
          - { wallet: unisat,      ext: "unisat-extension-v1.7.15" }
          - { wallet: leather,     ext: "leather-extension-v6.102.0" }
          - { wallet: okx,         ext: "okx-extension-v4.1.0" }
          - { wallet: phantom,     ext: "phantom-extension-v26.16.0" }
          - { wallet: wizz,        ext: "wizz-extension-v2.13.4" }
          - { wallet: alby,        ext: "alby-extension-v3.14.2" }
          # cat21wallet is built from source, not downloaded — no `ext` key.
          - { wallet: cat21wallet, ext: "" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      # Xverse is bootstrapped in EVERY shard: global-setup.ts pre-seeds
      # the Xverse vault snapshot and runs once per Playwright invocation
      # regardless of which wallet is under test. Cached, ~5s on a hit.
      - name: Cache unpacked Xverse extension
        id: xverse-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/xverse
          key: xverse-extension-v2.3.2

      - name: Download + unpack Xverse from internal release mirror
        if: steps.xverse-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh xverse

      # The wallet under test, when it is a downloaded .crx other than
      # xverse (already handled above) and not cat21wallet (built from
      # source below).
      - name: Cache unpacked ${{ matrix.wallet }} extension
        id: wallet-cache
        if: matrix.ext != '' && matrix.wallet != 'xverse'
        uses: actions/cache@v4
        with:
          path: e2e/extensions/${{ matrix.wallet }}
          key: ${{ matrix.ext }}

      - name: Download + unpack ${{ matrix.wallet }} from internal release mirror
        if: matrix.ext != '' && matrix.wallet != 'xverse' && steps.wallet-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh ${{ matrix.wallet }}

      # Cat21 Wallet — our own wallet (ordpool-space/cat21-wallet).
      # We build from source so a CRX release of the wallet isn't a
      # prerequisite for SDK CI. Clone the public repo (read-only
      # HTTPS, no auth, no main-identity attribution lands), pnpm
      # build, then point the bootstrap at the resulting dist.
      #
      # Cache key includes cat21-wallet's remote HEAD SHA so the
      # cached dist invalidates the moment the wallet repo gets a
      # new commit (iter 121 lesson: the previous key was based on
      # the bootstrap script's hash, which doesn't change across
      # wallet commits → stale dist served, Cat21Provider injection
      # missing).
      - name: Compute cat21-wallet HEAD SHA (for cache invalidation)
        id: cat21wallet-rev
        if: matrix.wallet == 'cat21wallet'
        run: |
          REV=$(git ls-remote https://github.com/ordpool-space/cat21-wallet.git refs/heads/main | cut -f1)
          echo "Cat21 Wallet main HEAD = $REV"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - name: Cache cat21-wallet source + build
        id: cat21wallet-cache
        if: matrix.wallet == 'cat21wallet'
        uses: actions/cache@v4
        with:
          path: |
            e2e/extensions/cat21wallet
            ~/.local/share/pnpm/store
          key: cat21wallet-from-source-${{ steps.cat21wallet-rev.outputs.rev }}

      - name: Install pnpm for cat21-wallet build
        if: matrix.wallet == 'cat21wallet' && steps.cat21wallet-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone + build cat21-wallet from source
        if: matrix.wallet == 'cat21wallet' && steps.cat21wallet-cache.outputs.cache-hit != 'true'
        env:
          # GitHub-provided token is enough for read-only public clone.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WALLET_DIR="/tmp/cat21-wallet"
          rm -rf "$WALLET_DIR"
          git clone --depth=1 https://github.com/ordpool-space/cat21-wallet.git "$WALLET_DIR"
          # cat21-wallet's prebuild hook (apps/extension/scripts/
          # check-sdk-fresh.cjs) expects ordpool-sdk to be checked
          # out as a sibling at /tmp/ordpool-sdk. This workflow
          # checks the SDK out at $GITHUB_WORKSPACE (default
          # location); symlink so the wallet's freshness check
          # finds it. dist-core is already built earlier in this
          # job by `npm ci` → prepare → npm run build.
          rm -rf /tmp/ordpool-sdk
          ln -s "$GITHUB_WORKSPACE" /tmp/ordpool-sdk
          cd "$WALLET_DIR"
          pnpm install --frozen-lockfile
          pnpm build:extension
          export CAT21_WALLET_LOCAL_DIST="${WALLET_DIR}/apps/extension/dist"
          cd "$GITHUB_WORKSPACE"
          rm -rf "e2e/extensions/cat21wallet"
          bash e2e/playwright/playwright-bootstrap.sh cat21wallet

      - name: Build SDK harness bundle for the fixtures server
        run: npm run e2e:harness:build

      # OUR electrs source — EVERY shard needs it: docker-compose.regtest.yml
      # builds the electrs service from ../../ordpool-electrs (the fork), so
      # even the default `up` (bitcoind + electrs) compiles our code now.
      #
      # actions/checkout v5 rejects paths outside $GITHUB_WORKSPACE, but the
      # compose build context `../../ordpool-electrs` (relative to
      # e2e/docker-compose.regtest.yml) resolves to the workspace's PARENT.
      # So we check out under the workspace, then symlink at the parent.
      - name: Checkout ordpool-electrs source (for the electrs container)
        uses: actions/checkout@v5
        with:
          repository: ordpool-space/ordpool-electrs
          ref: ordpool
          path: _ordpool-electrs-src
      - name: Symlink ordpool-electrs at compose's expected location
        run: ln -s "$GITHUB_WORKSPACE/_ordpool-electrs-src" "$(dirname "$GITHUB_WORKSPACE")/ordpool-electrs"

      # cat21-ord source — `docker compose --profile cat21-ord up`
      # below builds the ord image from this checkout. Only the ord
      # shard (cat21wallet) needs it; its transfer/offer/accept specs
      # poll `/status` on ord.
      #
      # Same PARENT-directory symlink dance as ordpool-electrs above.
      - name: Checkout cat21-ord source (for the cat21-ord container)
        if: matrix.wallet == 'cat21wallet'
        uses: actions/checkout@v5
        with:
          repository: ordpool-space/cat21-ord
          ref: index-cat21
          path: _cat21-ord-src
      - name: Symlink cat21-ord at compose's expected location
        if: matrix.wallet == 'cat21wallet'
        run: ln -s "$GITHUB_WORKSPACE/_cat21-ord-src" "$(dirname "$GITHUB_WORKSPACE")/cat21-ord"

      # A docker-container builder + the Actions runtime env are what make
      # the type=gha cache in docker-compose.gha-cache.yml usable (the
      # default `docker` driver can't export a cache, and type=gha needs
      # the runtime token). Every matrix shard rebuilds electrs on its own
      # runner from the same pinned source, and this repo's e2e-regtest
      # workflow builds the same electrs + cat21-ord under the same cache
      # scopes — so a shard reads a warm cache instead of recompiling Rust.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Export GitHub Actions runtime for the gha cache backend
        uses: crazy-max/ghaction-github-runtime@v3

      # Exclude each fresh checkout's volatile `.git/` from the `COPY . .`
      # build context so the COPY layer digest (and the cargo-build layer
      # beneath it) is stable across runs and the compile cache-hits.
      # Same reasoning as e2e-regtest.yml. Written into the checkout dirs
      # (symlinked at the parent as the compose build context) so the
      # electrs / cat21-ord forks stay untouched.
      - name: Stabilise the electrs build context for layer caching
        run: printf '.git\ntarget\n' > _ordpool-electrs-src/.dockerignore

      - name: Stabilise the cat21-ord build context for layer caching
        if: matrix.wallet == 'cat21wallet'
        run: printf '.git\ntarget\n' > _cat21-ord-src/.dockerignore

      # Regtest stack. Every shard needs bitcoind + electrs to fund,
      # broadcast and mine. The ord shard additionally brings up
      # cat21-ord (profile-gated; default `up` is bitcoind + electrs only).
      # Build through buildx bake (COMPOSE_BAKE) so the gha overlay's
      # cache_from/to take effect; bake loads each image (they have an
      # `image:` name) so the following `up --no-build` finds them.
      - name: Build electrs image (buildx, gha-cached)
        if: matrix.wallet != 'cat21wallet'
        env:
          COMPOSE_BAKE: "true"
        # Read-only overlay: the matrix imports the cache e2e-regtest writes,
        # but each shard must NOT export it (redundant + tips the heaviest
        # shard over its timeout on cold runs). Scope to `electrs`: these
        # shards don't check out cat21-ord, so never touch the ord context.
        run: docker compose -f e2e/docker-compose.regtest.yml -f e2e/docker-compose.gha-cache-ro.yml build electrs

      - name: Start regtest stack (bitcoind + electrs)
        if: matrix.wallet != 'cat21wallet'
        run: docker compose -f e2e/docker-compose.regtest.yml up -d --no-build

      - name: Build electrs + cat21-ord images (buildx, gha-cached)
        if: matrix.wallet == 'cat21wallet'
        env:
          COMPOSE_BAKE: "true"
        # Read-only (see above): import e2e-regtest's cache, don't export.
        run: docker compose -f e2e/docker-compose.regtest.yml -f e2e/docker-compose.gha-cache-ro.yml --profile cat21-ord build

      - name: Start regtest stack (bitcoind + electrs + cat21-ord)
        if: matrix.wallet == 'cat21wallet'
        # regtest-bootstrap.sh + the curl polls below handle readiness, so
        # no --wait.
        run: docker compose -f e2e/docker-compose.regtest.yml --profile cat21-ord up -d --no-build

      - name: Mine 101 blocks (coinbase maturity) + verify electrs is indexing
        env:
          REGTEST_ELECTRS_URL: http://localhost:3000
        run: |
          bash e2e/regtest-bootstrap.sh > /tmp/regtest-bootstrap.json
          cat /tmp/regtest-bootstrap.json
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/blocks/tip/height >/dev/null; then
              echo "electrs ready"
              break
            fi
            sleep 1
            if [ "$i" = "60" ]; then
              echo "electrs never came up"
              docker compose -f e2e/docker-compose.regtest.yml logs --tail 80
              exit 1
            fi
          done

      - name: Wait for cat21-ord to be ready on :8080/status
        if: matrix.wallet == 'cat21wallet'
        run: |
          for i in {1..120}; do
            if curl -fsS http://localhost:8080/status >/dev/null; then
              echo "cat21-ord ready"
              exit 0
            fi
            sleep 1
          done
          echo "cat21-ord never came up"
          docker compose -f e2e/docker-compose.regtest.yml logs --tail 80 ord
          exit 1

      - name: Run ${{ matrix.wallet }} Playwright specs under xvfb
        env:
          # global-setup.ts skips the ~25s Xverse seed onboarding in every
          # non-xverse shard (only xverse-*.spec.ts clone the seed).
          WALLET: ${{ matrix.wallet }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e:playwright -- ${{ matrix.wallet }}

      - name: Stop regtest stack
        if: always()
        run: docker compose -f e2e/docker-compose.regtest.yml down -v

      - name: Upload artifacts (screenshots, traces, DOM dumps, manifest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.wallet }}
          path: |
            test-results/
            playwright-report/
            e2e/extensions/${{ matrix.wallet }}/manifest.json
            e2e/extensions/xverse/manifest.json
          retention-days: 7
          if-no-files-found: warn
