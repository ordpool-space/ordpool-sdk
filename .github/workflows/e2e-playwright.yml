name: E2E (playwright + xverse)

# Iteration 1: prove we can load the published Xverse .crx in
# headed Chromium under xvfb in CI. Onboarding flow + mint
# roundtrip land in follow-up iterations once we have CI
# screenshots confirming the entry point.
#
# This workflow does NOT run on dev machines. The Xverse .crx is
# unverified-binary code; we keep it off contributor laptops.

on:
  push:
    branches: [main]
    paths:
      - 'e2e/playwright/**'
      - '.github/workflows/e2e-playwright.yml'
      - 'src/**'
      - 'package*.json'
  pull_request:
    paths:
      - 'e2e/playwright/**'
      - '.github/workflows/e2e-playwright.yml'
      - 'src/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read    # gh release download needs read access to the same repo's releases

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium

      # Cache unpacked extensions keyed by the version pinned in
      # playwright-bootstrap.sh. First run on a new version:
      # download .crx from this repo's release asset and unzip (~5s).
      # Subsequent runs: cache hit, no download.
      - name: Cache unpacked Xverse extension
        id: xverse-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/xverse
          key: xverse-extension-v2.3.2

      - name: Download + unpack Xverse from internal release mirror
        if: steps.xverse-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh xverse

      - name: Cache unpacked Unisat extension
        id: unisat-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/unisat
          key: unisat-extension-v1.7.15

      - name: Download + unpack Unisat from internal release mirror
        if: steps.unisat-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh unisat

      - name: Cache unpacked Leather extension
        id: leather-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/leather
          key: leather-extension-v6.102.0

      - name: Download + unpack Leather from internal release mirror
        if: steps.leather-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh leather

      - name: Cache unpacked OKX extension
        id: okx-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/okx
          key: okx-extension-v4.1.0

      - name: Download + unpack OKX from internal release mirror
        if: steps.okx-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh okx

      - name: Cache unpacked Phantom extension
        id: phantom-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/phantom
          key: phantom-extension-v26.16.0

      - name: Download + unpack Phantom from internal release mirror
        if: steps.phantom-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh phantom

      - name: Cache unpacked Wizz extension
        id: wizz-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/wizz
          key: wizz-extension-v2.13.4

      - name: Download + unpack Wizz from internal release mirror
        if: steps.wizz-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh wizz

      - name: Cache unpacked Oyl extension
        id: oyl-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/oyl
          key: oyl-extension-v1.17.1

      - name: Download + unpack Oyl from internal release mirror
        if: steps.oyl-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh oyl

      - name: Cache unpacked Alby extension
        id: alby-cache
        uses: actions/cache@v4
        with:
          path: e2e/extensions/alby
          key: alby-extension-v3.14.2

      - name: Download + unpack Alby from internal release mirror
        if: steps.alby-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash e2e/playwright/playwright-bootstrap.sh alby

      # Cat21 Wallet — our own wallet (ordpool-space/cat21-wallet).
      # We build from source so a CRX release of the wallet isn't a
      # prerequisite for SDK CI. Clone the public repo (read-only
      # HTTPS, no auth, no main-identity attribution lands), pnpm
      # build, then point the bootstrap at the resulting dist.
      #
      # Cache key includes cat21-wallet's remote HEAD SHA so the
      # cached dist invalidates the moment the wallet repo gets a
      # new commit (iter 121 lesson: the previous key was based on
      # the bootstrap script's hash, which doesn't change across
      # wallet commits → stale dist served, Cat21Provider injection
      # missing).
      - name: Compute cat21-wallet HEAD SHA (for cache invalidation)
        id: cat21wallet-rev
        run: |
          REV=$(git ls-remote https://github.com/ordpool-space/cat21-wallet.git refs/heads/dev | cut -f1)
          echo "Cat21 Wallet dev HEAD = $REV"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - name: Cache cat21-wallet source + build
        id: cat21wallet-cache
        uses: actions/cache@v4
        with:
          path: |
            e2e/extensions/cat21wallet
            ~/.local/share/pnpm/store
          key: cat21wallet-from-source-${{ steps.cat21wallet-rev.outputs.rev }}

      - name: Install pnpm for cat21-wallet build
        if: steps.cat21wallet-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone + build cat21-wallet from source
        if: steps.cat21wallet-cache.outputs.cache-hit != 'true'
        env:
          # GitHub-provided token is enough for read-only public clone.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WALLET_DIR="/tmp/cat21-wallet"
          rm -rf "$WALLET_DIR"
          git clone --depth=1 https://github.com/ordpool-space/cat21-wallet.git "$WALLET_DIR"
          cd "$WALLET_DIR"
          pnpm install --frozen-lockfile
          pnpm build:extension
          export CAT21_WALLET_LOCAL_DIST="${WALLET_DIR}/apps/extension/dist"
          cd "$GITHUB_WORKSPACE"
          rm -rf "e2e/extensions/cat21wallet"
          bash e2e/playwright/playwright-bootstrap.sh cat21wallet

      - name: Build SDK harness bundle for the fixtures server
        run: npm run e2e:harness:build

      # Pipeline B's mint roundtrip spec funds, broadcasts and
      # mines against this regtest stack. bitcoind + mempool/electrs
      # come up on localhost:18443 / :3000 respectively.
      - name: Start regtest stack (bitcoind + electrs)
        # --wait would block on electrs's wget healthcheck which the
        # mempool/electrs image lacks; the curl poll below handles
        # the actual readiness check.
        run: docker compose -f e2e/docker-compose.regtest.yml up -d

      - name: Mine 101 blocks (coinbase maturity) + verify electrs is indexing
        env:
          REGTEST_ELECTRS_URL: http://localhost:3000
        run: |
          bash e2e/regtest-bootstrap.sh > /tmp/regtest-bootstrap.json
          cat /tmp/regtest-bootstrap.json
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/blocks/tip/height >/dev/null; then
              echo "electrs ready"
              exit 0
            fi
            sleep 1
          done
          echo "electrs never came up"
          docker compose -f e2e/docker-compose.regtest.yml logs --tail 80
          exit 1

      - name: Run Playwright tests under xvfb
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e:playwright

      - name: Stop regtest stack
        if: always()
        run: docker compose -f e2e/docker-compose.regtest.yml down -v

      - name: Upload artifacts (screenshots, traces, DOM dumps, manifest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            e2e/extensions/xverse/manifest.json
            e2e/extensions/unisat/manifest.json
            e2e/extensions/leather/manifest.json
            e2e/extensions/okx/manifest.json
            e2e/extensions/phantom/manifest.json
            e2e/extensions/wizz/manifest.json
            e2e/extensions/oyl/manifest.json
            e2e/extensions/alby/manifest.json
          retention-days: 7
          if-no-files-found: warn
