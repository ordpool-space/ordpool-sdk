name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - run: npm install
    - run: npm run test

    # Enforce the "build before commit" HARD RULE from
    # .claude/CLAUDE.md: rebuild dist/ (Angular fesm2022) and fail
    # if it drifts from what was committed. dist-core/ is NOT
    # checked in — regenerated per-install via the prepare hook —
    # so we only diff dist/.
    - name: Verify committed dist/ matches a fresh build
      run: |
        npm run build:angular
        git diff --exit-code dist/
