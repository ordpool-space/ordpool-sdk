name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - run: npm install
    - run: npm run test

    # dist/ is NOT checked in — regenerated per-install via the prepare hook.
    # Build it once, then check BOTH entry points it serves.
    #
    # Requiring each barrel catches a broken emit or require cycle at the
    # source, instead of in a consumer's red CI: /core's consumers are
    # cat21-wallet and cat21-indexer's CommonJS backend, and a CommonJS app
    # loads it exactly this way. The esbuild pass additionally resolves the
    # main barrel's whole internal import graph the way a frontend bundler
    # does, with deps external.
    - name: Build dist/ and check both entry points
      run: |
        npm run build:main
        node -e "require('./dist/core.js')"
        node -e "require('./dist/index.js')"
        node -e "require('esbuild').build({entryPoints:['dist/index.js'],bundle:true,write:false,format:'esm',packages:'external'}).catch(() => process.exit(1))"

    # dist-e2e/ (compiled e2e helpers, imported by consumers as
    # `ordpool-sdk/e2e`) IS checked in so they import instead of copying raw
    # .ts out of node_modules. Rebuild + fail on drift, and smoke-load the
    # barrel so a missing include fails HERE, not in a consumer's regtest CI.
    - name: Verify committed dist-e2e/ matches a fresh build + loads
      run: |
        npm run build:e2e
        node -e "require('./dist-e2e/index.js')"
        git diff --exit-code dist-e2e/

    # wasm/brotli_wasm_bg.wasm is the one binary this package ships. Rebuild
    # it from wasm-src/brotli-ord (pinned image, locked crates) and fail if
    # it differs from the committed file, so the shipped bytes are provably
    # built from the source in this repo.
    - name: Verify committed brotli wasm matches a fresh build
      run: |
        npm run build:brotli-wasm
        git diff --exit-code wasm/ wasm-src/
